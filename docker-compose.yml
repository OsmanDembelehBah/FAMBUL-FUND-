version: '3.8'

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - USSD_GATEWAY_URL=http://ussd-gateway:8080
      - INTELLIGENCE_SERVICE_URL=http://intelligence-service:8000
    depends_on:
      - intelligence-service
      - ussd-gateway
      - redis
    restart: always

  intelligence-service:
    build:
      context: ./intelligence-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always

  ussd-gateway:
    build:
      context: ./ussd-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis:6379
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
